name: CI/CD Pipeline for HTML Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run SonarQube Scan
      uses: SonarSource/sonar-scanner-action@v1.0
      with:
        host-url: ${{ secrets.SONAR_HOST_URL }}
        login: ${{ secrets.SONAR_TOKEN }}
        project-key: my-html-project
        project-name: My HTML Project
        sources: .